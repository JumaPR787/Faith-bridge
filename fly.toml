# Fly.io — backend de FaithBridge.
# Desplegar desde la raíz del repositorio:  fly deploy --ha=false
# Secretos con «fly secrets set» (NUNCA en este archivo). Ver docs/despliegue-fly.md

app = "faithbridge-api"          # cambia si el nombre ya está tomado
primary_region = "iad"           # Ashburn, Virginia: cerca de Supabase us-east-1 y de los proveedores
kill_signal = "SIGTERM"
kill_timeout = "30s"             # tiempo para cerrar sesiones en vivo y guardar el uso

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  # Aplica las migraciones pendientes en una máquina temporal ANTES de actualizar.
  # Si fallan, el despliegue se cancela y sigue la versión anterior.
  release_command = "node dist/scripts/migrate.js"
  strategy = "immediate"

[env]
  APP_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  STT_PROVIDER = "deepgram"
  DEEPGRAM_MODEL = "nova-3"
  DEEPGRAM_KEYTERMS_ENABLED = "true"
  TRANSLATION_PROVIDER = "anthropic"
  TRANSLATION_MODEL = "claude-haiku-5-5"
  SANDBOX_PURCHASES = "allow"
  PURGE_INTERVAL_HOURS = "6"

[http_service]
  internal_port = 8080
  force_https = true
  # Las sesiones en vivo viven en memoria: UNA máquina siempre encendida.
  # Un apagado automático cortaría las sesiones de los usuarios.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
